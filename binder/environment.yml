# Local Conda environment. Not used by Streamlit Cloud (see requirements.txt at repo root).
name: sim_env

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - simpy>=4.0
  - vidigi
  - numpy>=1.21
  - pandas>=1.3
  - scipy>=1.11
  - joblib>=1.1
  - openpyxl
  - pyyaml
  - tqdm
  - matplotlib>=3.4
  - plotly
  - graphviz
  - streamlit>=1.28
  - jupyterlab
  - notebook
  - ipykernel
  - ipywidgets
  - pytest
  - pytest-cov
  - black
  - flake8
  - pylint
